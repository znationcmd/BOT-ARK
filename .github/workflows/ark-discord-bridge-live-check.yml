name: BOT ARK - Discord connection bridge live verification
on:
  push:
    paths: [".github/workflows/ark-discord-bridge-live-check.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify bridge is configured and invalid requests safely rejected
        shell: bash
        run: |
          set -euo pipefail
          url="https://bot-ark-production.up.railway.app"
          for attempt in 1 2 3 4 5 6; do
            code=$(curl --silent --show-error --location --max-time 20 -o /tmp/ark-health -w '%{http_code}' "$url/health" || true)
            echo "Health attempt $attempt: $code"
            if [ "$code" = "200" ]; then break; fi
            sleep 8
          done
          [ "$code" = "200" ] || { echo "Bot service not healthy"; exit 1; }
          code=$(curl --silent --show-error --max-time 30 -o /tmp/ark-bridge-response -w '%{http_code}' "$url/auth/discord-bridge")
          echo "Unauthenticated Discord bridge: HTTP $code"
          cat /tmp/ark-bridge-response
          echo
          [ "$code" = "303" ] || { echo "Expected safe redirect to the login error page (not raw JSON)"; exit 1; }
          headers=$(curl --silent --show-error --max-time 30 -D - -o /dev/null "$url/auth/discord-bridge")
          echo "$headers" | grep -qi "location: /auth/discord-error?reason=unauthorized"
          code=$(curl --silent --show-error --max-time 30 -o /tmp/ark-oauth-error-page -w '%{http_code}' "$url/auth/discord-error?reason=unauthorized")
          [ "$code" = "401" ] || { echo "Invalid link page must reject with 401"; exit 1; }
          grep -q "Réessayer Discord" /tmp/ark-oauth-error-page
          grep -q "Retour au Dashboard" /tmp/ark-oauth-error-page
          echo "Bridge configured, invalid tokens blocked, and safe 3D-brand recovery page displayed"
