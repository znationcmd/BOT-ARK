name: BOT ARK - welcome and departure role checks
on:
  push:
    paths:
      - "src/bot.js"
      - "src/app.js"
      - "src/modules.js"
      - "public/app.js"
      - "public/index.html"
      - "public/sw.js"
      - "test/welcome-roles.test.js"
      - ".github/workflows/bot-ark-welcome-roles.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate JavaScript syntax
        run: |
          node --check src/app.js
          node --check src/bot.js
          node --check src/modules.js
          node --check public/app.js
      - name: Test welcome roles, goodbye notifications, and persistent settings
        run: node --test test/welcome-roles.test.js
